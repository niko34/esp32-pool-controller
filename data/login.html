<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0066cc" />
    <title>Connexion - PoolController</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 2026 Ambient background - cohérent avec wizard */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #e8ecf4 0%, #dfe5f0 100%);
        background-attachment: fixed;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: relative;
      }

      /* 2026 Container - cohérent avec wizard */
      .login-container {
        background: white;
        border-radius: 16px;
        /* 2026 Card System - élévation perceptible */
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0, 0, 0, 0.08);
        max-width: 400px;
        width: 100%;
        padding: 40px;
        position: relative;
        z-index: 1;
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo img {
        width: 80px;
        height: 80px;
        margin-bottom: 15px;
      }

      .logo h1 {
        font-size: 24px;
        color: #333;
        margin-bottom: 5px;
      }

      .logo p {
        font-size: 14px;
        color: #666;
      }

      /* 2026 Alerts - cohérent avec système global */
      .alert {
        padding: 14px 16px;
        border-radius: 12px;
        border: 1.5px solid;
        margin-bottom: 20px;
        font-size: 14px;
        animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

    .alert.error {
      background: rgba(255, 59, 48, 0.06);
      border-color: rgba(255, 59, 48, 0.2);
      color: #b91c1c;
    }

    .alert.warn {
      background: rgba(245, 158, 11, 0.10);
      border-color: rgba(180, 83, 9, 0.35);
      color: #92400e;
    }

    .alert.success {
      background: rgba(52, 199, 89, 0.06);
      border-color: rgba(52, 199, 89, 0.2);
      color: #15803d;
    }

      .form-group {
        margin-bottom: 20px;
      }

      /* 2026 Machine d'états - inputs standardisés */
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #1a1d29;
        margin-bottom: 8px;
        letter-spacing: -0.1px;
      }

      input:not(.vh) {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #e5e7eb;
        border-radius: 10px;
        font-size: 14px;
        background: #fafbfc;
        transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
        height: 44px;
      }

      input:hover {
        border-color: #d1d5db;
        background: white;
      }

      input:focus {
        outline: none;
        border-color: #5c7cdb;
        background: white;
        box-shadow: 0 0 0 3px rgba(92, 124, 219, 0.08);
      }

      /* État error - SEULEMENT après blur ou submit */
    input.is-error {
      border-color: #b91c1c;
      background: rgba(255, 59, 48, 0.03);
    }

      input.is-error:focus {
        box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.1);
      }

      .password-requirements {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }

      /* 2026 Boutons - micro-polish CTA */
      button {
        width: 100%;
        min-height: 44px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #4a68c8 0%, #5470d0 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 2px 8px rgba(92, 124, 219, 0.2);
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(92, 124, 219, 0.35);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 1px 4px rgba(92, 124, 219, 0.25);
      }

      button:focus-visible {
        outline: 2px solid #5c7cdb;
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        pointer-events: none;
        box-shadow: none;
      }

      .secondary {
        margin-top: 12px;
        background: #e5e7eb;
        color: #1a1d29;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .secondary:hover:not(:disabled) {
        background: #d1d5db;
        transform: translateY(-1px);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      .secondary:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .secondary:focus-visible {
        outline-color: #6b7280;
      }

      .hidden {
        display: none;
      }

      /* Champ identifiant masqué visuellement (gestionnaires de mots de passe) */
      .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        overflow: hidden;
      }

      @media (max-width: 499px) {
        .login-container {
          padding: 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .alert {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="logo">
        <img src="/apple-touch-icon.png" alt="PoolController" />
        <h1>PoolController</h1>
        <p>Connexion administrateur</p>
      </div>

      <!-- 2026 Accessible alerts -->
      <!-- Alert premier démarrage -->
      <div id="firstBootAlert" class="alert hidden" role="status" aria-live="polite">
        <strong>Premier démarrage détecté</strong><br>
        Veuillez définir un nouveau mot de passe administrateur.
      </div>

      <!-- Alert erreur -->
      <div id="errorAlert" class="alert error hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>

      <!-- Alert succès -->
      <div id="successAlert" class="alert success hidden" role="status" aria-live="polite" aria-atomic="true"></div>

      <!-- Formulaire connexion standard -->
      <form id="loginForm" aria-label="Formulaire de connexion">
        <input type="text" class="vh" name="username" value="admin" autocomplete="username" tabindex="-1" aria-hidden="true" />

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Entrez votre mot de passe"
            required
            autocomplete="current-password"
            aria-required="true" />
        </div>

        <button type="submit" id="loginBtn">Se connecter</button>
      </form>

      <!-- Formulaire changement mot de passe (premier démarrage)
           ⛔ INATTEIGNABLE AUJOURD'HUI : showFirstBootForm() (plus bas) n'a AUCUN
           appelant — vérifié le 2026-11-18. La prise de possession passe par
           wizard.html. Son texte est tenu à jour malgré tout (une phrase fausse
           dans le dépôt reste fausse), mais son RETRAIT est un sujet de suite. -->
      <form id="changePasswordForm" class="hidden" aria-label="Formulaire de changement de mot de passe">
        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe</label>
          <input
            type="password"
            id="newPassword"
            name="new-password"
            placeholder="8 caractères minimum"
            required
            minlength="8"
            autocomplete="new-password"
            aria-required="true"
            aria-describedby="passwordHint" />
          <div class="password-requirements" id="passwordHint">
            8 caractères minimum, avec une minuscule, une majuscule, un chiffre
            et un caractère spécial.
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirm-password"
            placeholder="Re-tapez le mot de passe"
            required
            autocomplete="new-password"
            aria-required="true" />
        </div>

        <button type="submit" id="changeBtn">Définir le mot de passe</button>
      </form>
    </div>

    <script>
      const loginForm = document.getElementById('loginForm');
      const changePasswordForm = document.getElementById('changePasswordForm');
      const firstBootAlert = document.getElementById('firstBootAlert');
      const errorAlert = document.getElementById('errorAlert');
      const successAlert = document.getElementById('successAlert');
      const loginBtn = document.getElementById('loginBtn');
      const passwordInput = document.getElementById('password');
      const LOGIN_LABEL = 'Se connecter';
      let countdownTimer = null;

      function setAlert(kind, text) {
        errorAlert.className = 'alert ' + kind;
        errorAlert.textContent = text; // textContent : jamais le texte du serveur
        successAlert.classList.add('hidden');
      }
      function clearAlert() {
        errorAlert.classList.add('hidden');
        errorAlert.textContent = '';
      }
      function clearFieldError() {
        passwordInput.classList.remove('is-error');
        passwordInput.removeAttribute('aria-invalid');
        passwordInput.removeAttribute('aria-describedby');
      }
      function stopCountdown() {
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        loginBtn.disabled = false;
        loginBtn.textContent = LOGIN_LABEL;
      }
      function fmtRemaining(ms) {
        const t = Math.max(0, Math.ceil(ms / 1000));
        return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
      }
      // bug-189 : ralentissement annoncé. Le bouton porte le compte à rebours ;
      // l'alerte, statique, porte la cause. Rien n'est mémorisé : recharger la
      // page est sans danger (le prochain clic reçoit un 429 et réarme).
      function startCountdown(seconds) {
        stopCountdown();
        const deadline = Date.now() + seconds * 1000;
        setAlert('warn', 'Trop d\u2019essais. Patientez un instant.');
        errorAlert.classList.remove('hidden');
        loginBtn.disabled = true;
        const draw = () => {
          const left = deadline - Date.now();
          if (left <= 0) {
            stopCountdown();
            clearAlert();
            passwordInput.focus();
            return;
          }
          loginBtn.textContent = 'Réessayer dans ' + fmtRemaining(left);
        };
        draw();
        countdownTimer = setInterval(draw, 1000);
      }
      async function retryAfterSeconds(response) {
        let n = parseInt(response.headers.get('Retry-After'), 10);
        if (!(n > 0)) {
          try {
            const body = await response.json();
            n = parseInt(body && body.retryAfter, 10);
          } catch (e) { n = NaN; }
        }
        if (!(n > 0)) n = 30;
        return Math.min(3600, Math.max(1, n));
      }

      // bug-185 : session invalidée (mot de passe modifié ailleurs) -> message
      // posé directement ; effacé au submit suivant ou à la première frappe.
      if (new URLSearchParams(window.location.search).get('expired') === '1') {
        setAlert('warn', 'Mot de passe modifié sur l\u2019appareil. Reconnectez-vous.');
        errorAlert.classList.remove('hidden');
      }
      passwordInput.addEventListener('input', () => {
        clearFieldError();
        if (!countdownTimer) clearAlert();
      });
      // Vérifier si premier démarrage
      async function checkFirstBoot() {
        try {
          const response = await fetch('/auth/status');
          if (response.ok) {
            const data = await response.json();
            // bug-185 : on ne redirige vers l'assistant que si AUCUN mot de passe
            // n'a jamais été choisi (`virgin`). ⛔ Pas sur `firstBoot` : un appareil
            // dont l'assistant a été interrompu APRÈS le choix du mot de passe a
            // firstBoot vrai, et l'assistant lui serait refusé — impasse. Dans ce
            // cas on affiche le formulaire de connexion : son mot de passe marche.
            const virgin = (data.virgin === undefined) ? data.firstBoot : data.virgin;
            if (virgin) {
              // Rediriger vers l'assistant de configuration au lieu d'afficher le formulaire
              window.location.href = '/wizard.html';
              return;
            }
          }
        } catch (error) {
          console.error('Erreur vérification statut:', error);
        }
      }

      function showFirstBootForm() {
        loginForm.classList.add('hidden');
        changePasswordForm.classList.remove('hidden');
        firstBootAlert.classList.remove('hidden');
      }

      function showError(message) {
        setAlert('error', message);
        errorAlert.classList.remove('hidden');
      }

      function showSuccess(message) {
        successAlert.textContent = message;
        successAlert.classList.remove('hidden');
        errorAlert.classList.add('hidden');
      }

      // Connexion standard
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (countdownTimer) return;
        const password = passwordInput.value;
        clearAlert();
        clearFieldError();

        let response;
        try {
          response = await fetch('/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              username: 'admin',
              password: password
            })
          });
        } catch (error) {
          setAlert('warn', 'Appareil injoignable. Vérifiez le Wi-Fi.');
          errorAlert.classList.remove('hidden');
          return;
        }

        if (response.ok) {
          let data = null;
          try { data = await response.json(); } catch (err) { data = null; }
          if (!data || typeof data.token !== 'string') {
            setAlert('warn', 'Réponse inattendue de l\u2019appareil (HTTP ' + response.status + ').');
            errorAlert.classList.remove('hidden');
            return;
          }
          // Stocker le token en session
          sessionStorage.setItem('authToken', data.token);
          // Note: ne pas désactiver l'AP au login (redémarrage inattendu).
          window.location.href = '/';
        } else if (response.status === 401) {
          showError('Mot de passe incorrect.');
          passwordInput.classList.add('is-error');
          passwordInput.setAttribute('aria-invalid', 'true');
          passwordInput.setAttribute('aria-describedby', 'errorAlert');
          passwordInput.focus();
          passwordInput.select();
        } else if (response.status === 429) {
          startCountdown(await retryAfterSeconds(response));
        } else {
          setAlert('warn', 'Réponse inattendue de l\u2019appareil (HTTP ' + response.status + ').');
          errorAlert.classList.remove('hidden');
        }
      });

      // Changement mot de passe (premier démarrage)
      changePasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
          showError('Les mots de passe ne correspondent pas');
          return;
        }

        if (newPassword.length < 8) {
          showError('Le mot de passe doit contenir au moins 8 caractères');
          return;
        }

        try {
          const response = await fetch('/auth/change-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              currentPassword: 'admin',
              newPassword: newPassword
            })
          });

          if (response.ok) {
            const data = await response.json();
            showSuccess('Mot de passe modifié avec succès ! Redirection en cours...');

            // Stocker le token
            sessionStorage.setItem('authToken', data.token);

            // Note: Ne pas désactiver automatiquement l'AP lors du changement de mot de passe
            // L'utilisateur sera redirigé vers le wizard qui gérera la configuration WiFi
            // et la désactivation de l'AP si nécessaire

            // Rediriger après 2 secondes (le token est déjà en sessionStorage)
            setTimeout(() => {
              window.location.href = '/';
            }, 2000);
          } else {
            const error = await response.json();
            showError(error.error || 'Erreur lors du changement de mot de passe');
          }
        } catch (error) {
          showError('Appareil injoignable. Vérifiez le Wi-Fi.');
        }
      });

      // Gestion touche Entrée sur les champs password
      document.getElementById('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          loginForm.dispatchEvent(new Event('submit', { cancelable: true }));
        }
      });

      document.getElementById('newPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('confirmPassword').focus();
        }
      });

      document.getElementById('confirmPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          changePasswordForm.dispatchEvent(new Event('submit', { cancelable: true }));
        }
      });

      // Vérifier le statut au chargement
      checkFirstBoot();
    </script>
  </body>
</html>
