; ENVIRONNEMENT MATÉRIEL UNIQUE : esp32dev_core3 (core Arduino 3.x / IDF 5),
; bootloader ET application, depuis v2.20.4 (ADR-0042). L'env de repli core 2 a
; été RETIRÉ en v2.42.1 (ADR-0069) : il n'était plus compilable depuis la
; v2.40.0, plus flashable (bootloader core 3, machine de développement sans port
; série) et aucun binaire de secours n'avait jamais été archivé.
; Il n'y a donc plus d'env de repli — toute régression du core 3 se traite en
; avant, pas en arrière.
;
; L'env `native` (tests unitaires) ne se lance qu'explicitement : `pio test -e native`.
[platformio]
default_envs = esp32dev_core3

; =============================================================================
; Env esp32dev_core3 — core Arduino 3.x / IDF 5 : ENVIRONNEMENT DE PRODUCTION
; depuis v2.20.4 (ADR-0042). Auparavant banc de compilation uniquement (feature-063).
; =============================================================================
; Pas d'upload_port ni de monitor_port ici, VOLONTAIREMENT : l'env historique de
; repli les figeait sur /dev/cu.usbserial-0001, ce qui échouait dès qu'on branchait
; un autre module. deploy.sh détecte le port et le passe en --upload-port ; à la
; main, PlatformIO auto-détecte.
; Plateforme pioarduino (le platform espressif32 officiel PlatformIO est gelé
; en core 2.x) — lancer avec le pio du penv : ~/.platformio/penv/bin/pio.
; Premier build sur une machine neuve : `pio pkg install -e esp32dev_core3`
; préalable (téléchargement du framework).
; ÉPINGLÉE sur la release taguée 55.03.37 (core 3.3.7 / IDF 5.5.0) = la version
; validée au banc feature-063 (porte de bascule ADR-0034). L'URL « stable »
; dérive (elle pointait déjà 55.03.311 au moment de l'épinglage) : toute montée
; de version est désormais un choix explicite, à re-valider au banc.
[env:esp32dev_core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200

board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.flash_size = 8MB
; Layout v5 : la puce EST une 8 Mo (esptool, Device 4017) ; le layout v4
; s'arrêtait à 0x400000 et en laissait 4 Mo inutilisés.
; app 1792 → 3648 KB, spiffs 320 → 512 KB, history 64 → 256 KB.
board_build.filesystem_size = 524288

lib_deps =
  ; Fork MAINTENU ESP32Async (ex-mathieucarbou) — versions ÉPINGLÉES.
  ; Corrige la race close/timeout WebSocket des libs originales me-no-dev
  ; (longueur corrompue passée à tcp_recved → assert lwIP tcp_update_rcv_ann_wnd).
  ; ESPAsyncWebServer 3.11.2 exige AsyncTCP ^3.4.10 (couple cohérent).
  ESP32Async/AsyncTCP@3.4.10
  ESP32Async/ESPAsyncWebServer@3.11.2
  https://github.com/alanswx/ESPAsyncWiFiManager.git
  bblanchon/ArduinoJson @ ^7.0.0
  knolleary/PubSubClient @ ^2.8
  ; feature-021 : Adafruit_ADS1X15 et DFRobot_PH supprimés (migration Atlas EZO).
  ; pH/ORP désormais lus en I²C natif via src/atlas_ezo.* (pas de lib externe).
  milesburton/DallasTemperature @ ^3.11.0
  paulstoffregen/OneWire @ ^2.3.8
  adafruit/RTClib @ ^2.1.4
  SPI

build_flags =
  -DASYNC_TCP_SSL_ENABLED=0
  -Os
  ; Récolte des clients WS gelés (bug-badalloc-ws-broadcast, revue 2.11.1) : file
  ; d'envoi par client bornée à 5 trames (défaut fork : 32 = ~58 Ko épinglés par
  ; zombie). Combiné à setCloseClientOnQueueFull(true) (ws_manager), le fork ferme
  ; lui-même le client saturé sous SON verrou — sans itération manuelle côté appelant.
  -DWS_MAX_QUEUED_MESSAGES=5
  ; Réduction Flash : neutralise les logs verbeux de l'ESP-IDF (le projet utilise
  ; systemLogger, pas ESP_LOGx) → aucune perte de log applicatif.
  -DCORE_DEBUG_LEVEL=0
  ; feature-066 : support PSRAM (module WROVER-E) — détection au boot, dégradation
  ; gracieuse sur module WROOM sans PSRAM (binaire unique). Les -mfix-* alignent
  ; notre code sur les libs précompilées (CONFIG_SPIRAM_CACHE_WORKAROUND=y,
  ; stratégie MEMW), comme les cartes WROVER officielles.
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw

; Archivage AUTOMATIQUE de firmware.elf ET firmware.bin à chaque `pio run`
; (bug-famine-8bits, bloc F) : builds/<VERSION>/firmware_<horodatage>.{elf,bin},
; rétention 5 par version. deploy.sh archivait déjà l'ELF, mais `pio run` direct et
; ./ota_update.sh ne passaient pas par lui — d'où un dernier ELF archivé datant du
; 02/08 et un coredump de production (15/08) INDÉCODABLE faute de symboles.
extra_scripts = post:tools/archive_build.py
; feature-063 : -DCONFIG_LWIP_MAX_SOCKETS / -DCONFIG_LWIP_TCP_MAXRTX retirés —
; flags CONFIG_* fantômes (lwip est précompilé dans le core Arduino, ces -D ne
; sont lus par aucun de nos fichiers). Correctif documentaire : ADR-0011.

# Note: Use ./build_fs.sh to build LittleFS with correct size (512KB, layout v5)
# PlatformIO's default buildfs uses wrong size from board definition

; =============================================================================
; Env native — tests unitaires hors matériel (feature-025)
; =============================================================================
; Compile UNIQUEMENT src/sensor_filter.cpp (logique pure, déterministe) avec un
; shim Arduino minimal (test/native_shim/Arduino.h) qui ne fournit que NAN /
; isnan / fabsf / types entiers — aucun mock métier. Lancer : `pio test -e native`.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<sensor_filter.cpp> +<dosing_logic.cpp> +<pulse_dosing_logic.cpp> +<schedule_logic.cpp> +<history_logic.cpp> +<ota_integrity_logic.cpp> +<self_heal_logic.cpp> +<net_health_logic.cpp> +<history_guard_logic.cpp> +<mqtt_topics_logic.cpp> +<measure_validity_logic.cpp> +<purge_stability_logic.cpp> +<time_to_target_logic.cpp> +<fopen_guard_logic.cpp> +<history_import_logic.cpp> +<logger_logic.cpp> +<utf8_clamp.cpp> +<log_arena_logic.cpp>
build_flags =
  -std=c++17
  -I src
  -I test/native_shim
  ; Force-include le shim logger AVANT tout : neutralise src/logger.h (qui tire
  ; <vector>/<FS.h>/freertos, indisponibles en natif) et fournit String + systemLogger.
  -include test/native_shim/logger_shim.h

; =============================================================================
; Env native_coverage — identique à `native` + instrumentation gcov/llvm-cov.
; =============================================================================
; Mesure la couverture des classes pures testées (sensor_filter, dosing_logic).
; Ne PAS utiliser pour le run de test normal (plus lent, génère des .gcda).
; Lancer via le script outillé : `./tools/coverage.sh` (qui appelle gcovr).
[env:native_coverage]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -O0
  -g
  --coverage
build_type = debug
; --coverage doit aussi être présent à l'édition de liens (cf. tools/coverage_link.py).
extra_scripts = pre:tools/coverage_link.py
