name: Hygiène du dépôt

# Deux contrôles d'invariant, sans toolchain ni cache — voir les commentaires de
# chaque job.
#
# JOB 1 — Unicité des specs.
# Vérifie qu'un nom de spec ne vit que dans UN seul des dossiers todo/ · doing/ ·
# done/. Le cycle procède par déplacement ; une spec copiée produit deux versions
# qui divergent et deux statuts qui se contredisent (constat du 2026-09-06 :
# trois specs dans todo/ ET done/, l'une annoncée « todo », l'autre « livrée et
# vérifiée »). Voir feature-103.
#
# Aucun filtre de chemins, aucune toolchain, aucun cache : le contrôle coûte une
# seconde et doit tourner sur TOUS les commits — un déplacement de spec n'accompagne
# pas nécessairement une modification de code.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hygiene-specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unicite:
    name: Unicité des specs (todo · doing · done)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # La logique vit dans le dépôt, pas dans ce YAML : le même script tourne en
      # local (`./tools/check_specs.sh`) et peut servir de hook pre-commit.
      - name: Contrôle d'unicité
        run: ./tools/check_specs.sh

  liens-doc:
    name: Liens de documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même famille que le contrôle d'unicité : le registre écrit doit rester
      # univoque ET navigable. Le chemin d'un lien vers une spec encode son ÉTAT
      # (`doing/`, `done/`) ; chaque promotion casse silencieusement les liens qui
      # citaient l'ancien emplacement. Constat du 2026-09-06 : 27 liens morts,
      # tous dans ce cas. Le commit qui promeut une spec échoue désormais tout de
      # suite, au lieu de laisser pourrir la doc pendant des mois.
      - name: Contrôle des liens de documentation
        run: ./tools/check_doc_links.sh

  # JOB 2 — Point d'admission unique des fopen internes (ADR-0070, bug-100).
  # Sur ESP32, un fopen dont le malloc du verrou newlib (92 o) échoue appelle
  # abort() : AUCUN code de retour à tester. Deux crashs de production
  # (29/08/2026, 05/09/2026) viennent de là. ADR-0070 rend le défaut
  # INEXPRIMABLE en imposant un point d'admission unique, src/fs_guard.cpp.
  #
  # Pourquoi ce job vit ICI et pas dans build-firmware.yml : « un contrôle que
  # personne ne lance ne rend rien inexprimable ». Ce workflow tourne sur TOUS
  # les commits, sans filtre de chemins, sans toolchain, sans cache — c'est la
  # seule place où l'invariant est vérifié aussi souvent qu'il peut être violé.
  # « L'ordre se voit, la liste s'oublie. »
  fopen-guard:
    name: Admission unique des fopen internes (ADR-0070)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_fopen_guard.sh`) et en CI.
      - name: Contrôle du point d'admission
        run: ./tools/check_fopen_guard.sh

  # JOB 4 — POOL_HEAP_PEEK absent de tout fichier versionné (S2/ADR-0081,
  # feature-128). R3 (lecture de contenu du tas) n'existe dans le binaire QUE
  # si cette macro est passée par PLATFORMIO_BUILD_FLAGS au moment du build —
  # jamais écrite dans un fichier du dépôt. Ce job ne prouve PAS l'artefact
  # publié par /release (c'est S1, câblé dans .claude/commands/release.md,
  # qui compile localement) : il protège de l'inadvertance dans l'arbre,
  # sur TOUS les commits, comme les trois jobs qui précèdent.
  no-peek-flag:
    name: POOL_HEAP_PEEK absent des fichiers versionnés (S2/ADR-0081)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_no_peek_flag.sh`) et en CI.
      - name: Contrôle de non-définition de POOL_HEAP_PEEK
        run: ./tools/check_no_peek_flag.sh

  # JOB 5 — la garde est la PREMIÈRE instruction de chaque route (S6,
  # feature-128). Sans ce job, personne d'autre que ce lot n'exécute
  # check_heap_routes_guard.sh : la sentinelle qui rend inexprimable le défaut
  # du 07/09 (handler de corps exécuté AVANT REQUIRE_AUTH) pourrirait en
  # silence, comme les quatre jobs qui précèdent le font pour leur invariant.
  heap-routes-guard:
    name: Garde en première instruction sur les routes du tas (S6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_heap_routes_guard.sh`) et en CI.
      - name: Contrôle de la place de la garde
        run: ./tools/check_heap_routes_guard.sh

  # JOB 6 — discipline mémoire du journal (ADR-0082, feature-130). feature-129
  # a remplacé le `std::vector<LogEntry>` de `String` — qui fractionnait le
  # plus gros bloc libre du tas 8 bits (168 o alloués ont détruit 23 552 o de
  # contiguïté à l'effondrement initial) — par une arène circulaire `.bss` de
  # taille fixe. Sans ce job, un `std::vector<String>` réintroduit demain dans
  # `logger.h` compile, passe `pio test -e native`, et ne rencontre AUCUN
  # contrôle : c'est exactement le défaut que feature-129 a corrigé, qui
  # redeviendrait invisible à la CI.
  memory-discipline:
    name: Discipline mémoire du journal (ADR-0082)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_memory_discipline.sh`) et en CI.
      - name: Contrôle de la discipline mémoire
        run: ./tools/check_memory_discipline.sh

  # JOB 7 — diffusion WebSocket ciblée (bug-081). Les trois `textAll()` de
  # src/ws_manager.cpp diffusaient à TOUS les clients de /ws, authentifiés ou
  # non — la garde ne vérifiait qu'« au moins un client authentifié ». Sans ce
  # job, un futur `textAll`/`binaryAll`/`printfAll` réintroduirait le même
  # défaut en silence, comme les jobs précédents le font pour le leur.
  ws-broadcast-targeting:
    name: Diffusion WebSocket ciblée (bug-081)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_ws_broadcast_targeting.sh`) et en CI.
      - name: Contrôle du ciblage des broadcasts WS
        run: ./tools/check_ws_broadcast_targeting.sh
