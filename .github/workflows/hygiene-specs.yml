name: Hygiène du dépôt

# Deux contrôles d'invariant, sans toolchain ni cache — voir les commentaires de
# chaque job.
#
# JOB 1 — Unicité des specs.
# Vérifie qu'un nom de spec ne vit que dans UN seul des dossiers todo/ · doing/ ·
# done/. Le cycle procède par déplacement ; une spec copiée produit deux versions
# qui divergent et deux statuts qui se contredisent (constat du 2026-09-06 :
# trois specs dans todo/ ET done/, l'une annoncée « todo », l'autre « livrée et
# vérifiée »). Voir feature-103.
#
# Aucun filtre de chemins, aucune toolchain, aucun cache : le contrôle coûte une
# seconde et doit tourner sur TOUS les commits — un déplacement de spec n'accompagne
# pas nécessairement une modification de code.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hygiene-specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unicite:
    name: Unicité des specs (todo · doing · done)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # La logique vit dans le dépôt, pas dans ce YAML : le même script tourne en
      # local (`./tools/check_specs.sh`) et peut servir de hook pre-commit.
      - name: Contrôle d'unicité
        run: ./tools/check_specs.sh

  liens-doc:
    name: Liens de documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même famille que le contrôle d'unicité : le registre écrit doit rester
      # univoque ET navigable. Le chemin d'un lien vers une spec encode son ÉTAT
      # (`doing/`, `done/`) ; chaque promotion casse silencieusement les liens qui
      # citaient l'ancien emplacement. Constat du 2026-09-06 : 27 liens morts,
      # tous dans ce cas. Le commit qui promeut une spec échoue désormais tout de
      # suite, au lieu de laisser pourrir la doc pendant des mois.
      - name: Contrôle des liens de documentation
        run: ./tools/check_doc_links.sh

  # JOB 2 — Point d'admission unique des fopen internes (ADR-0070, bug-100).
  # Sur ESP32, un fopen dont le malloc du verrou newlib (92 o) échoue appelle
  # abort() : AUCUN code de retour à tester. Deux crashs de production
  # (29/08/2026, 05/09/2026) viennent de là. ADR-0070 rend le défaut
  # INEXPRIMABLE en imposant un point d'admission unique, src/fs_guard.cpp.
  #
  # Pourquoi ce job vit ICI et pas dans build-firmware.yml : « un contrôle que
  # personne ne lance ne rend rien inexprimable ». Ce workflow tourne sur TOUS
  # les commits, sans filtre de chemins, sans toolchain, sans cache — c'est la
  # seule place où l'invariant est vérifié aussi souvent qu'il peut être violé.
  # « L'ordre se voit, la liste s'oublie. »
  fopen-guard:
    name: Admission unique des fopen internes (ADR-0070)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_fopen_guard.sh`) et en CI.
      - name: Contrôle du point d'admission
        run: ./tools/check_fopen_guard.sh

  # JOB 4 — POOL_HEAP_PEEK absent de tout fichier versionné (S2/ADR-0081,
  # feature-128). R3 (lecture de contenu du tas) n'existe dans le binaire QUE
  # si cette macro est passée par PLATFORMIO_BUILD_FLAGS au moment du build —
  # jamais écrite dans un fichier du dépôt. Ce job ne prouve PAS l'artefact
  # publié par /release (c'est S1, câblé dans .claude/commands/release.md,
  # qui compile localement) : il protège de l'inadvertance dans l'arbre,
  # sur TOUS les commits, comme les trois jobs qui précèdent.
  no-peek-flag:
    name: POOL_HEAP_PEEK absent des fichiers versionnés (S2/ADR-0081)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_no_peek_flag.sh`) et en CI.
      - name: Contrôle de non-définition de POOL_HEAP_PEEK
        run: ./tools/check_no_peek_flag.sh

  # JOB 5 — la garde est la PREMIÈRE instruction de chaque route (S6,
  # feature-128). Sans ce job, personne d'autre que ce lot n'exécute
  # check_heap_routes_guard.sh : la sentinelle qui rend inexprimable le défaut
  # du 07/09 (handler de corps exécuté AVANT REQUIRE_AUTH) pourrirait en
  # silence, comme les quatre jobs qui précèdent le font pour leur invariant.
  heap-routes-guard:
    name: Garde en première instruction sur les routes du tas (S6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_heap_routes_guard.sh`) et en CI.
      - name: Contrôle de la place de la garde
        run: ./tools/check_heap_routes_guard.sh

  # JOB 6 — discipline mémoire du journal (ADR-0082, feature-130). feature-129
  # a remplacé le `std::vector<LogEntry>` de `String` — qui fractionnait le
  # plus gros bloc libre du tas 8 bits (168 o alloués ont détruit 23 552 o de
  # contiguïté à l'effondrement initial) — par une arène circulaire `.bss` de
  # taille fixe. Sans ce job, un `std::vector<String>` réintroduit demain dans
  # `logger.h` compile, passe `pio test -e native`, et ne rencontre AUCUN
  # contrôle : c'est exactement le défaut que feature-129 a corrigé, qui
  # redeviendrait invisible à la CI.
  memory-discipline:
    name: Discipline mémoire du journal (ADR-0082)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_memory_discipline.sh`) et en CI.
      - name: Contrôle de la discipline mémoire
        run: ./tools/check_memory_discipline.sh

  # JOB 7 — diffusion WebSocket ciblée (bug-081). Les trois `textAll()` de
  # src/ws_manager.cpp diffusaient à TOUS les clients de /ws, authentifiés ou
  # non — la garde ne vérifiait qu'« au moins un client authentifié ». Sans ce
  # job, un futur `textAll`/`binaryAll`/`printfAll` réintroduirait le même
  # défaut en silence, comme les jobs précédents le font pour le leur.
  ws-broadcast-targeting:
    name: Diffusion WebSocket ciblée (bug-081)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_ws_broadcast_targeting.sh`) et en CI.
      - name: Contrôle du ciblage des broadcasts WS
        run: ./tools/check_ws_broadcast_targeting.sh

  # JOB 8 — point de passage unique de la comptabilité pompe (bug-115).
  # accountPumpVolume() n'était appelée QUE depuis la queue nominale
  # d'update() : toute sortie anticipée (OTA, maintenance, capteurs non
  # initialisés, eau absente / stabilisation / assistant de débit) revenait
  # AVANT elle, laissant _acctPumpOn[]/lastSafetyTimestamp rémanents pendant
  # toute la fenêtre aveugle. Corrigé par le point de passage unique
  # settlePumpAccounting(). pump_controller.cpp n'est PAS compilable
  # nativement (FreeRTOS/Arduino/I2C) : aucun test natif ne peut prouver que
  # les quatre sorties l'atteignent toutes — ce job vérifie la condition
  # nécessaire à la place, sur TOUS les commits, comme les jobs qui précèdent.
  acct-settle-single-point:
    name: Comptabilité pompe — point de passage unique (bug-115)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_acct_settle_single_point.sh`) et en CI.
      - name: Contrôle du point de passage unique
        run: ./tools/check_acct_settle_single_point.sh

  # JOB 9 — les vecteurs SHA-256 du JS d'upload OTA tournent vraiment
  # (feature-118, P2/security-reviewer condition 1). test/sha256_vectors.js
  # était vert, versionné… et ORPHELIN : aucun workflow ne l'appelait, et
  # `pio test -e native` ne voit pas un fichier `.js`. Il EXTRAIT désormais le
  # texte réel de data/app.js (SHA256_K, createSha256) au lieu d'en tester une
  # copie — toute divergence future entre le JS livré et ce qui est vérifié
  # est donc structurellement impossible. Node est préinstallé sur
  # ubuntu-latest : aucun actions/setup-node nécessaire.
  sha256-vectors:
    name: Vecteurs SHA-256 du JS d'upload OTA (feature-118)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_sha256_vectors.sh`) et en CI.
      - name: Contrôle des vecteurs SHA-256
        run: ./tools/check_sha256_vectors.sh

  # JOB 10 — garde anti-retour du vocabulaire de l'ancienne chaîne de mesure
  # (feature-152, D6/D7). 14 étages et 13 états bloquants sont devenus 5 étages
  # sans aucun verrou ; sans ce job, le premier correctif pressé qui recopie un
  # message d'un commit antérieur (« filtre non prêt », « capteur instable »,
  # « stabilisation du filtre », les alertes *_filter_rearm_denied/
  # *_filter_not_ready) fait réapparaître en silence le vocabulaire — et avec
  # lui la question — d'un fonctionnement abandonné. Périmètre PRÉCIS, voir
  # l'en-tête du script : data/ en texte brut, src/ limité aux littéraux
  # `"..."` hors des fichiers où rearm/latch désignent des mécanismes
  # INDÉPENDANTS toujours actifs (feedforward pH, oom_guard, net_health, heap,
  # session pH, intégrale pH).
  removed-measurement-vocabulary:
    name: Vocabulaire retiré de la chaîne de mesure (feature-152, D6/D7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_removed_measurement_vocabulary.sh`) et en CI.
      - name: Contrôle anti-retour du vocabulaire
        run: ./tools/check_removed_measurement_vocabulary.sh

  # JOB 11 — la logique pure de la carte « Signaux capteurs » tourne vraiment
  # (feature-153, D3). Patron du job 9 (sha256-vectors, feature-118) : une
  # sentinelle que personne ne lance ne protège de rien. Les trois fonctions
  # pures `groupHistoryPoints()` / `seriesStats()` / `traceWindowDurationMs()`
  # de `data/app.js` sont EXTRAITES par ancre + comptage de profondeur, jamais
  # recopiées, puis évaluées sous Node contre des vecteurs couvrant fenêtres
  # partielles, fenêtre entièrement vide (aucun point, pas un point à 0),
  # bornes de fenêtre, `null` ignorés sans être comptés, et la dépendance de
  # la durée annoncée à la cadence réelle. Node est préinstallé sur
  # ubuntu-latest : aucun actions/setup-node nécessaire.
  trace-logic-vectors:
    name: Vecteurs de la logique « Signaux capteurs » (feature-153)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_trace_logic_vectors.sh`) et en CI.
      - name: Contrôle des vecteurs de logique de trace
        run: ./tools/check_trace_logic_vectors.sh

  # JOB 12 — les vecteurs de santé pH tournent vraiment (feature-154,
  # pastilles de santé par critère sonde pH). Patron des jobs 9 et 11
  # (sha256-vectors, trace-logic-vectors) : une sentinelle que personne ne
  # lance ne protège de rien. `classifyPhCriterion()` de `data/app.js` est le
  # MIROIR exact d'`isPhProbeHealthy()` côté firmware (src/ph_guard_logic.h) —
  # c'est elle qui juge les trois pastilles (pente acide, pente base, décalage
  # zéro) de l'écran « État sonde pH ». Le script EXTRAIT le texte réel de
  # cette fonction (ancre + comptage de profondeur, scanner désormais
  # factorisé dans `test/js_extract.js`, ADR-0099 amendé) au lieu d'en tester
  # une copie, puis l'évalue contre des vecteurs couvrant les bornes exactes
  # (90,0/110,0/15,0, incluses comme saines), le faux vert historique
  # (115 %), le zéro négatif, les valeurs non exploitables, et une assertion
  # STRUCTURELLE : le code extrait ne contient aucun littéral numérique hors
  # 0 et 1 (ADR-0100 — un seuil de santé est servi, jamais réécrit côté
  # client). Node est préinstallé sur ubuntu-latest : aucun
  # actions/setup-node nécessaire.
  ph-health-vectors:
    name: Vecteurs de santé pH par critère (feature-154)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Même script en local (`./tools/check_ph_health_vectors.sh`) et en CI.
      - name: Contrôle des vecteurs de santé pH
        run: ./tools/check_ph_health_vectors.sh
