name: Build firmware

# Compile l'environnement matériel — ce que `tests-natifs.yml` ne fait PAS : il ne
# lance que la logique pure sur runner Linux.
#
# POURQUOI CE WORKFLOW : sans lui, « le firmware ne compile plus » est un défaut que
# rien ne signale. C'est ainsi que la casse de l'ancien env de repli est passée
# inaperçue pendant deux versions (v2.40.0 → v2.42.0), découverte par hasard le
# 2026-09-06. Le retrait de ce repli (ADR-0069) a supprimé une victime, pas la classe
# de défaut : elle vaut pour esp32dev_core3, seul env restant, et pour tout successeur.
# Voir feature-103.
#
# Workflow SÉPARÉ de tests-natifs.yml volontairement : un échec de compilation et un
# échec de test sont deux signaux distincts, et les mêler sous un nom « Tests natifs »
# rendrait le résultat ambigu.

# ⚠️ Liste de chemins DUPLIQUÉE à dessein : GitHub Actions ne supporte pas les
# ancres YAML (`&ancre` / `*ancre`). Toute modification doit être faite DEUX fois.
#
# Contrepartie du filtre : un commit purement documentaire ne consomme pas de
# minutes de runner, mais si ce job devient un jour un « required check » de PR,
# une PR ne touchant aucun de ces chemins n'obtiendra jamais le statut attendu et
# restera non fusionnable. Documenté dans docs/BUILD.md.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'partitions.csv'
      - 'tools/archive_build.py'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'partitions.csv'
      - 'tools/archive_build.py'
      - '.github/workflows/build-firmware.yml'

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Compilation esp32dev_core3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ⚠️ Clé DISTINCTE de celle de tests-natifs.yml (`pio-...`), et ce n'est pas
      # cosmétique : une clé de cache GitHub Actions est IMMUABLE une fois créée. Les
      # deux workflows démarrant en parallèle sur le même commit, si le job natif
      # gagne la course il écrit sous cette clé un cache ne contenant que l'env
      # `native` (quelques Mo) ; le job firmware le restaurerait, retéléchargerait
      # 2 Go de toolchain, et ne pourrait JAMAIS sauvegarder le sien — la clé étant
      # déjà prise. Résultat : 2 Go à chaque run, indéfiniment.
      #
      # Le préfixe `pio-fw-` donne au firmware son propre espace. La clé reste indexée
      # sur platformio.ini : une montée de plateforme invalide le cache d'elle-même,
      # ce qui est le comportement voulu.
      - name: Cache PlatformIO & pip (espace firmware)
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-fw-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-fw-${{ runner.os }}-

      - name: Installer PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Gate : la compilation doit passer. `pio run` affiche lui-même l'occupation
      # RAM / Flash — la marge de la partition applicative est donc lisible dans le log.
      - name: Compiler le firmware (pio run -e esp32dev_core3)
        run: pio run -e esp32dev_core3

      # Gate — feature-128 (S2, défense en profondeur) : la CI ne compile JAMAIS
      # avec PLATFORMIO_BUILD_FLAGS (aucune variable de ce nom n'est exportée
      # dans ce job), donc ce `.bin` DOIT être la forme de production. Ce
      # contrôle porte sur l'ARTEFACT — indépendamment de tout motif textuel
      # cherché par check_no_peek_flag.sh (job « hygiène du dépôt », qui lui ne
      # voit que l'arbre) — mais il ne couvre QUE cette CI : l'artefact publié
      # par `/release` est compilé LOCALEMENT, dans l'environnement de
      # l'appelant, et reste vérifié séparément par
      # tools/check_release_artefacts.sh (S1, .claude/commands/release.md).
      - name: R3 (/debug/heap_peek) absente du binaire compilé (S2, défense en profondeur)
        run: |
          count=$(grep -a -c '/debug/heap_peek' .pio/build/esp32dev_core3/firmware.bin || true)
          echo "grep -a -c '/debug/heap_peek' firmware.bin -> ${count:-0}"
          if [ "${count:-0}" -ge 1 ]; then
            echo "ERREUR : /debug/heap_peek présent dans le binaire compilé par cette CI." >&2
            exit 1
          fi

      # Sections du binaire, pour l'historique des runs : c'est la mesure qui sert de
      # preuve d'équivalence lors d'un retrait de code mort (méthode ADR-0069).
      # Jamais bloquant : le chemin de la toolchain peut changer d'une version à l'autre.
      - name: Sections du binaire (informatif)
        if: always()
        continue-on-error: true
        run: |
          outil="$(find ~/.platformio/packages -name 'xtensa-esp32-elf-size' -type f | head -1)"
          if [ -n "$outil" ]; then
            "$outil" .pio/build/esp32dev_core3/firmware.elf
          else
            echo "xtensa-esp32-elf-size introuvable — étape informative ignorée."
          fi
