name: Tests natifs

# Exécute la suite de tests Unity hors matériel (logique pure : sensor_filter,
# dosing_logic) sur le runner Linux — aucun ESP32 requis. Sert de filet de
# sécurité partagé : bloque toute PR / push sur main qui casse un test ou fait
# chuter la couverture de lignes sous le seuil.

on:
  push:
    branches: [main]
  pull_request:

# Annule un run précédent encore en cours sur la même réf (économie de minutes CI).
concurrency:
  group: tests-natifs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Tests natifs + couverture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Installer PlatformIO + gcovr
        run: |
          python -m pip install --upgrade pip
          pip install platformio gcovr

      # Gate principal : les tests doivent passer (env non instrumenté = ce que
      # lance le développeur en local).
      - name: Tests Unity (pio test -e native)
        run: pio test -e native

      # Mesure de couverture sur l'env instrumenté + seuil minimal de lignes.
      # gcc/gcov sont fournis par le runner ubuntu (gcovr les utilise par défaut).
      - name: Couverture (gcovr, seuil lignes ≥ 90%)
        run: |
          pio test -e native_coverage
          mkdir -p coverage
          # Filtre LARGE (`src/`) et non plus deux modules nommés : la couverture
          # suit désormais automatiquement tout module ajouté au `build_src_filter`
          # de [env:native]. Avec l'ancien filtre, un module pur ajouté SANS test
          # n'apparaissait nulle part et ne faisait pas bouger le chiffre — la
          # mesure ne surveillait que ce qu'on avait pensé à lui nommer.
          # Mesuré au 2026-09-06 sur les 34 modules, APRÈS les tests de feature-105 :
          # lignes 100 % (1810/1810), fonctions 100 % (161/161), branches 86,8 %.
          # Le seuil de 90 lignes est conservé — confortable, mais c'est un plancher
          # de non-régression, pas un objectif. AUCUN seuil de branches n'est posé :
          # les 86,8 % portent sur des demi-branches défensives dont plusieurs sont
          # inatteignables par entrée réaliste (motifs écrits dans les tests).
          gcovr --root . \
            --filter 'src/' \
            --txt --print-summary \
            --fail-under-line 90 \
            --html-details coverage/index.html \
            .pio/build/native_coverage

      # Rapport HTML consultable depuis l'onglet "Artifacts" du run.
      - name: Publier le rapport de couverture (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14
